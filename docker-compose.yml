services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8003:8000"
    environment:
      APP_ENV: local
      APP_KEY: base64:dGVzdGluZ2tleWZvcmxhcmF2ZWwxMDE=
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
      JWT_SECRET: docker-jwt-secret-for-laravel-101-dev

volumes:
  postgres_data:
